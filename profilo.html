<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profilo — SailTropics</title><style>:root{--bg:#0f1720;--panel:#16222e;--ink:#dbe7f1;--muted:#8aa2b5;--accent:#4db6ac;--line:#24384a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px;max-width:600px;margin:auto}a{color:var(--accent)}</style></head><body>
<div style="display:flex;align-items:center;gap:9px;margin:0 0 2px"><svg viewBox="0 0 64 52" width="42" height="36" aria-hidden="true" style="flex-shrink:0"><circle cx="19" cy="20" r="9" fill="#F0705A"/><path d="M28 4 C40 14 46 30 43 46 L28 46 Z" fill="#1E5A9E"/><path d="M26 12 L26 46 L14 46 C18 34 21 22 26 12 Z" fill="#16406F"/><path d="M6 47 q9 -7 20 -2 t 30 1" stroke="#2BB3A3" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M12 51 q8 -5 17 -1 t 22 0" stroke="#57CFC0" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><span style="font-size:20px;font-weight:700;letter-spacing:.01em;color:var(--ink)">Sail<span style="color:var(--accent)">Tropics</span></span></div>
<div style="font-size:11px;color:var(--muted);margin:0 0 16px;letter-spacing:.08em;text-transform:uppercase">Portolano — Profilo</div>
<h1>Profilo</h1>
<div id="box" style="border:1px solid var(--line);border-radius:10px;padding:16px;background:#0b131b">Caricamento…</div>
<script>
function render(){
  const b=document.getElementById('box');
  const logged=localStorage.getItem('sailtropics_logged')==='1';
  const u=JSON.parse(localStorage.getItem('sailtropics_user')||'null');
  if(!logged||!u){b.innerHTML='Non sei loggato. <a href="accedi.html">Accedi</a> o <a href="iscriviti.html">Iscriviti</a>';return;}
  b.innerHTML='<b>Nickname:</b> '+(u.nick||'—')+'<br><b>Email:</b> '+u.email+'<br><b>Barca:</b> '+(u.barca||'—')+'<br><b>Aree:</b> '+(u.aree||[]).join(', ')||'—'+'<br><b>Paesi:</b> '+(u.paesi||[]).join(', ')||'—'+'<br><b>Frequenza:</b> '+(u.freq||'—')+'<br><br><b>Verificato:</b> '+(u.verified?'✅ Sì':'⏳ In attesa verifica mail')+'<br><br><button onclick="localStorage.removeItem(\'sailtropics_logged\');location.reload()" style="padding:7px 12px;border-radius:8px;background:transparent;color:var(--accent);border:1px solid var(--line)">Esci</button> <button onclick="if(confirm(\'Cancello tutto?\')){localStorage.clear();location.href=\'iscriviti.html\'} " style="padding:7px 12px;border-radius:8px;background:#3a1a1a;color:#ffb9b9;border:1px solid #d32f2f">Disiscrizione</button>';
}
render();
const p=new URLSearchParams(location.search);
if(p.get('verified')==='1'){const u=JSON.parse(localStorage.getItem('sailtropics_user')||'null');if(u){u.verified=true;localStorage.setItem('sailtropics_user',JSON.stringify(u));localStorage.setItem('sailtropics_logged','1');}}
</script>
</body></html>
