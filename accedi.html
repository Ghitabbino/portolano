<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accedi — SailTropics</title><style>:root{--bg:#0f1720;--panel:#16222e;--ink:#dbe7f1;--muted:#8aa2b5;--accent:#4db6ac;--line:#24384a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px;max-width:480px;margin:auto}a{color:var(--accent)}input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#16222e;color:var(--ink)}button{padding:9px 16px;border-radius:8px;background:var(--accent);color:#06231f;font-weight:800;border:1px solid var(--accent);cursor:pointer}</style></head><body>
<div style="display:flex;align-items:center;gap:9px;margin:0 0 2px"><svg viewBox="0 0 64 52" width="42" height="36" aria-hidden="true" style="flex-shrink:0"><circle cx="19" cy="20" r="9" fill="#F0705A"/><path d="M28 4 C40 14 46 30 43 46 L28 46 Z" fill="#1E5A9E"/><path d="M26 12 L26 46 L14 46 C18 34 21 22 26 12 Z" fill="#16406F"/><path d="M6 47 q9 -7 20 -2 t 30 1" stroke="#2BB3A3" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M12 51 q8 -5 17 -1 t 22 0" stroke="#57CFC0" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><span style="font-size:20px;font-weight:700;letter-spacing:.01em;color:var(--ink)">Sail<span style="color:var(--accent)">Tropics</span></span></div>
<div style="font-size:11px;color:var(--muted);margin:0 0 16px;letter-spacing:.08em;text-transform:uppercase">Portolano — Accedi</div>
<div style="margin:0 0 14px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:rgba(77,182,172,.08)"><b style="color:var(--accent)">📖 Wiki libera</b><span style="color:var(--ink)"> — consultazione senza iscrizione. Accedi solo per modificare o gestire i tuoi alert.</span></div>
<h1>Accedi</h1>
<div style="border:1px solid var(--line);border-radius:10px;padding:16px;background:#0b131b">
<label>Email</label><input id="email" type="email" autocomplete="email" list="email-list2"><datalist id="email-list2"></datalist>
<label style="margin-top:10px;display:block">Password</label><input id="pass" type="password">
<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px;color:var(--muted);cursor:pointer"><input type="checkbox" id="keep-logged" checked> Mantienimi collegato</label>
<div style="text-align:center;margin:14px 0"><button onclick="login()">Accedi</button></div>
<div id="msg" style="display:none;padding:10px;border-radius:8px"></div>
</div>
<p style="font-size:13px">Non hai account? <a href="iscriviti.html">Iscriviti</a> — <a href="index.html">Torna al portolano</a></p>
<div style="margin:18px 0 0;padding:10px 12px;border-left:3px solid #ffb74d;background:#131e29;color:var(--muted);font-size:12px;line-height:1.5"><b style="color:#ffb74d">⚠️ Portolano collaborativo e indipendente</b> — informazioni verificate, verifica sempre con carta ufficiale.</div>
<script>
function login(){
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value;
  const keep=document.getElementById('keep-logged')?.checked;
  const saved=JSON.parse(localStorage.getItem('sailtropics_user')||sessionStorage.getItem('sailtropics_user')||'null');
  const m=document.getElementById('msg');
  if(!saved||(saved.email!==email && saved.nick!==email)){m.style.display='block';m.style.background='#3a1a1a';m.style.border='1px solid #d32f2f';m.textContent='Account non trovato. Iscriviti prima.';return;}
  if(saved.pass && saved.pass!==pass){m.style.display='block';m.style.background='#3a1a1a';m.style.border='1px solid #d32f2f';m.textContent='Password errata.';return;}
  if(keep){ localStorage.setItem('sailtropics_logged','1'); sessionStorage.removeItem('sailtropics_logged'); }
  else { sessionStorage.setItem('sailtropics_logged','1'); localStorage.removeItem('sailtropics_logged'); }
  m.style.display='block';m.style.background='#0f2e1f';m.style.border='1px solid var(--accent)';m.textContent='✅ Login riuscito — torno in prima pagina…';
  setTimeout(()=>location.href='index.html', 700);
}
(function(){const s=JSON.parse(localStorage.getItem('sailtropics_emails')||'[]');const dl=document.getElementById('email-list2');if(dl) s.forEach(e=>{const o=document.createElement('option');o.value=e;dl.appendChild(o);});})();
</script>
</body></html>
