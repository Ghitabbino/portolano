<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contribuisci — SailTropics</title><style>:root{--bg:#0f1720;--panel:#16222e;--ink:#dbe7f1;--muted:#8aa2b5;--accent:#4db6ac;--line:#24384a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px;max-width:720px;margin:auto}a{color:var(--accent)}</style><style>#lang-switch{position:fixed;top:10px;right:12px;z-index:2200;display:flex;gap:4px;background:#16222e;border:1px solid #24384a;border-radius:20px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}#lang-switch a{padding:4px 9px;border-radius:12px;font-size:12px;font-weight:700;color:#8aa2b5;text-decoration:none}#lang-switch a.active{background:#4db6ac;color:#06231f}#lang-switch a:hover{background:#1d3040;color:#dbe7f1}</style></head><body><div id="lang-switch" role="navigation" aria-label="Language switch"><a href="en/index.html" data-lang="en">English</a><a href="fr/index.html" data-lang="fr">Français</a><a href="es/index.html" data-lang="es">Español</a><a href="de/index.html" data-lang="de">Deutsch</a><a href="pt/index.html" data-lang="pt">Português</a><a href="it/index.html" data-lang="it">Italiano</a></div>
<div style="display:flex;align-items:center;gap:9px;margin:0 0 2px"><svg viewBox="0 0 64 52" width="42" height="36" aria-hidden="true" style="flex-shrink:0"><circle cx="19" cy="20" r="9" fill="#F0705A"/><path d="M28 4 C40 14 46 30 43 46 L28 46 Z" fill="#1E5A9E"/><path d="M26 12 L26 46 L14 46 C18 34 21 22 26 12 Z" fill="#16406F"/><path d="M6 47 q9 -7 20 -2 t 30 1" stroke="#2BB3A3" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M12 51 q8 -5 17 -1 t 22 0" stroke="#57CFC0" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg><span style="font-size:20px;font-weight:700;letter-spacing:.01em;color:var(--ink)">Sail<span style="color:var(--accent)">Tropics</span></span></div>
<div style="font-size:11px;color:var(--muted);margin:0 0 16px;letter-spacing:.08em;text-transform:uppercase">Portolano — Contribuisci</div>
<div style="background:linear-gradient(135deg,#0f1720 0%,#1e3a4a 100%);border:2px solid #4db6ac;border-radius:16px;padding:20px;margin:14px 0;color:#dbe7f1"><div style="font-size:22px;margin-bottom:6px">✏️ Contribuisci al portolano</div><div style="font-size:14px;line-height:1.6">Pagina in costruzione — qui troverai il modulo per proporre aggiornamenti.</div></div>
<p>Per ora torna alla tua <a href="profilo.html">pagina personale</a> o al <a href="index.html">portolano</a>.</p>
<script>(function(){const langs=['en','fr','es','de','pt','it'];const m=location.pathname.match(/\/(en|fr|es|de|pt|it)\//);const cur=m?m[1]:'it';document.documentElement.lang=cur;const sw=document.getElementById('lang-switch');if(sw){sw.querySelectorAll('a[data-lang]').forEach(a=>{if(a.dataset.lang===cur)a.classList.add('active')});sw.querySelectorAll('a[data-lang]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=a.dataset.lang;if(t===cur)return;try{localStorage.setItem('sailtropics_lang',t)}catch(e){}const h=location.hash||'';if(location.pathname.includes('/paesi/')){location.href='../'+t+'/index.html'+h;}else if(location.pathname.includes('/it/')||location.pathname.includes('/en/')||location.pathname.includes('/fr/')||location.pathname.includes('/es/')||location.pathname.includes('/de/')||location.pathname.includes('/pt/')){location.href=location.href.replace('/'+cur+'/','/'+t+'/');}else{const base=location.pathname.includes('/portolano/')?'/portolano/':'/';location.href=base+t+'/'+h;}}));}})();</script></body></html>
