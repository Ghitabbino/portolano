<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fix meolo — auto</title><style>body{font:15px/1.5 sans-serif;padding:24px;max-width:600px;margin:auto;background:#0f1720;color:#dbe7f1}a{color:#4db6ac}button{padding:10px 18px;border-radius:8px;background:#4db6ac;color:#06231f;font-weight:800;border:1px solid #4db6ac;cursor:pointer}</style><style>#lang-switch{position:fixed;top:10px;right:12px;z-index:2200;display:flex;gap:4px;background:#16222e;border:1px solid #24384a;border-radius:20px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}#lang-switch a{padding:4px 9px;border-radius:12px;font-size:12px;font-weight:700;color:#8aa2b5;text-decoration:none}#lang-switch a.active{background:#4db6ac;color:#06231f}#lang-switch a:hover{background:#1d3040;color:#dbe7f1}</style></head><body><div id="lang-switch" role="navigation" aria-label="Language switch"><a href="en/index.html" data-lang="en">English</a><a href="fr/index.html" data-lang="fr">Français</a><a href="es/index.html" data-lang="es">Español</a><a href="de/index.html" data-lang="de">Deutsch</a><a href="pt/index.html" data-lang="pt">Português</a><a href="it/index.html" data-lang="it">Italiano</a></div>
<h1>Fix meolo — riparato</h1>
<p>Profilo <b>meolo / 1234</b> creato automaticamente. Verrai reindirizzato alla pagina personale dove selezioni gli alert.</p>
<div id="msg" style="margin-top:12px;padding:10px;border-radius:8px;background:#0f2e1f;border:1px solid #4db6ac">✅ Fatto! Reindirizzamento in corso…</div>
<pre id="dbg" style="background:#0b131b;border:1px solid #24384a;border-radius:8px;padding:10px;overflow:auto;font-size:12px;margin-top:12px"></pre>
<script>
(function(){
  const user={nick:"meolo", email:"meolo", pass:"1234", barca:"", sel:[], aree:[], paesi:[], channels:["mail"], freq:["istantaneo"], grado:"Comandante", token:"fix-meolo-"+Date.now(), verified:true, ts:Date.now()};
  localStorage.setItem('sailtropics_user', JSON.stringify(user));
  localStorage.setItem('sailtropics_logged','1');
  sessionStorage.removeItem('sailtropics_logged');
  let emails=JSON.parse(localStorage.getItem('sailtropics_emails')||'[]');
  if(!emails.includes("meolo")){ emails.push("meolo"); localStorage.setItem('sailtropics_emails', JSON.stringify(emails)); }
  const dbg=document.getElementById('dbg');
  dbg.textContent='localStorage sailtropics_user: '+localStorage.getItem('sailtropics_user')+'\nlocalStorage logged: '+localStorage.getItem('sailtropics_logged');
  // reindirizza alla pagina personale del portolano (wiki) — it, en, e standalone
  setTimeout(()=>{
    // prova wiki it (più usato), poi fallback a profilo standalone
    const targetHash='#p5'; // PROFILO_PID = p5
    const base=location.pathname.includes('/portolano/')?'/portolano/':'/';
    // se siamo su fix-meolo.html a root, vai a it/index.html#p5
    location.href=base+'it/index.html'+targetHash;
  }, 800);
})();
</script>
<script>(function(){const langs=['en','fr','es','de','pt','it'];const m=location.pathname.match(/\/(en|fr|es|de|pt|it)\//);const cur=m?m[1]:'it';document.documentElement.lang=cur;const sw=document.getElementById('lang-switch');if(sw){sw.querySelectorAll('a[data-lang]').forEach(a=>{if(a.dataset.lang===cur)a.classList.add('active')});sw.querySelectorAll('a[data-lang]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const t=a.dataset.lang;if(t===cur)return;try{localStorage.setItem('sailtropics_lang',t)}catch(e){}const h=location.hash||'';if(location.pathname.includes('/paesi/')){location.href='../'+t+'/index.html'+h;}else if(location.pathname.includes('/it/')||location.pathname.includes('/en/')||location.pathname.includes('/fr/')||location.pathname.includes('/es/')||location.pathname.includes('/de/')||location.pathname.includes('/pt/')){location.href=location.href.replace('/'+cur+'/','/'+t+'/');}else{const base=location.pathname.includes('/portolano/')?'/portolano/':'/';location.href=base+t+'/'+h;}}));}})();</script></body></html>
